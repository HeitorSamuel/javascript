<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Contador</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <header>
        <h1>Vamos Contar</h1>
    </header>
    <main>
        <section>
            <div>
                <p>
                    <label for="txtinic">Início: </label>
                    <input type="number" name="txtinic" id="txtinic">
                </p>
                <p>
                    <label for="txtfim">Fim:</label>
                    <input type="number" name="txtfim" id="txtfim">
                </p>
                <p>
                    <label for="txtpasso">Passo:</label>
                    <input type="number" name="txtpasso" id="txtpasso">
                </p>
                <p>
                    <input type="button" value="Contar" onclick="contar()">
                </p>
            </div>
            <div id="res">
                Preparando a contagem...
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; CursoemVídeo</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
