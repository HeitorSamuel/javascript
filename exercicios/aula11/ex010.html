<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificando Multas</title>
</head>
<body>
    <h1>Sistema de multas</h1>
    <p>
        Velocidade do carro: <input type="number" name="txtvel" id="txtvel"> Km/h
        <input type="button" value="Verificar" onclick="clicar()">
    </p>
    <div id="res">

    </div>

    <script>
        function clicar(){
            var txtvel = document.getElementById('txtvel')
            var res = document.getElementById('res')
            var vel = Number(txtvel.value)
            res.innerHTML = `<p>A sua velocidade é de <strong>${vel} Km/h</strong><p/>`
                if (vel > 60){
                    res.innerHTML += `<p>Você ultrapassou o limite de velocidade. <strong>Multado!</strong></p>`
                }
            res.innerHTML += `<p>Dirija sempre com <strong>o cinto de segurança!</strong></p>`
        }
    </script>
</body>
</html>
